<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pompa Gizlilik Politikası</title>
  <style>
    :root {
      --bg: #080c12;
      --surface: #151b22;
      --surface-2: #10161d;
      --border: #2d3540;
      --text: #f5f7fa;
      --muted: #9aa3ad;
      --accent: #ffcc00;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at 78% 16%, rgba(255, 204, 0, 0.12), transparent 28%),
        linear-gradient(135deg, #080c12 0%, #121922 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    main {
      width: min(760px, calc(100% - 32px));
      min-height: 100vh;
      margin: 0 auto;
      display: grid;
      place-items: center;
      padding: 48px 0;
    }

    .content {
      width: 100%;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }

    .logo {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #05080c;
      overflow: hidden;
    }

    .logo img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .brand strong {
      display: block;
      font-size: 18px;
    }

    .brand span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 64px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .lead {
      max-width: 620px;
      margin: 18px 0 36px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.65;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .card {
      display: block;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%);
      color: var(--text);
      text-decoration: none;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .card:hover,
    .card:focus-visible {
      transform: translateY(-3px);
      border-color: var(--accent);
      outline: none;
    }

    .platform {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .platform span {
      font-size: 14px;
      color: var(--accent);
      font-weight: 700;
      text-transform: uppercase;
    }

    .arrow {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255, 204, 0, 0.12);
      color: var(--accent);
      font-size: 20px;
      font-weight: 700;
    }

    .card strong {
      display: block;
      margin-bottom: 10px;
      font-size: 26px;
      line-height: 1.2;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    footer {
      margin-top: 28px;
      color: var(--muted);
      font-size: 14px;
    }

    footer a {
      color: var(--accent);
    }

    @media (max-width: 680px) {
      main {
        place-items: start center;
        padding-top: 40px;
      }

      .cards {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="content" aria-labelledby="page-title">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <img src="./pompa_app_icon.png" alt="">
        </div>
        <div>
          <strong>Pompa</strong>
          <span>Gizlilik politikası</span>
        </div>
      </div>
      <div class="cards">
        <a class="card" href="./android.html">
          <div class="platform">
            <span>Android</span>
            <div class="arrow" aria-hidden="true">→</div>
          </div>
        </a>

        <a class="card" href="./ios.html">
          <div class="platform">
            <span>iOS</span>
            <div class="arrow" aria-hidden="true">→</div>
          </div>
        </a>
      </div>

      <footer>
        İletişim: <a href="mailto:pompa.app@outlook.com">pompa.app@outlook.com</a>
      </footer>
    </section>
  </main>
</body>
</html>
